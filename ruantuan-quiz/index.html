<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>入团积极分子 · 团课知识自测</title>
<style>
/* ========== 设计变量（基线复刻 + 新增语义变量） ========== */
:root{
  --red:#b8272d; --red-d:#8f1d22; --red-l:#e0585e;
  --gold:#d9a534; --gold-l:#f0c96b;
  --cream:#fbf7f0; --paper:#fffdf9;
  --ink:#332e2a; --ink-soft:#6b625a; --ink-faint:#9c9184;
  --line:#e8ded0; --line-strong:#d8c9b4;

  --s-unanswered-fg:#6b625a; --s-unanswered-bg:#f3ede3; --s-unanswered-mark:#a89b8b;
  --s-correct-fg:#1f6b41; --s-correct-bg:#e8f4ec; --s-correct-mark:#2e8b57;
  --s-wrong-fg:#a52a1e; --s-wrong-bg:#fdeeed; --s-wrong-mark:#c0392b;
  --s-skip-fg:#8a5a00; --s-skip-bg:#fdf3dc; --s-skip-mark:#c98a12;
  --s-due-fg:#4c3a8f; --s-due-bg:#efeafb; --s-due-mark:#6e5bb5;

  --tip-bg:#fff4d6; --tip-bd:#f0c96b; --tip-fg:#7a5600;

  --danger:var(--s-wrong-fg); --danger-d:#8a2318;
  --danger-bg:var(--s-wrong-bg); --danger-line:#f3c3be;
  --exam-spine:var(--red); --exam-time-bg:var(--cream); --exam-time-fg:var(--ink-faint);
  --profile-ring:var(--gold-l);
  --profile-grad:linear-gradient(135deg,var(--red),var(--red-d));
  --bar-gold:linear-gradient(90deg,var(--gold-l),var(--red-l));
  /* 收藏：金色点睛语义，零蓝；徽标文字用深琥珀而非亮金 */
  --fav-on:var(--gold); --fav-on-edge:#a67c00; --fav-hover:var(--gold);
  --fav-off:var(--ink-faint); --fav-badge-bg:rgba(217,165,52,.16); --fav-badge-fg:var(--tip-fg);

  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-1:0 2px 8px rgba(96,58,32,.07);
  --sh-2:0 10px 28px rgba(96,58,32,.13);
  --header-h:64px; --stats-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--cream); color:var(--ink); line-height:1.6; min-height:100vh;
  background-image:radial-gradient(circle at 10% 6%,rgba(217,165,52,.10),transparent 26%),
                   radial-gradient(circle at 92% 94%,rgba(184,39,45,.07),transparent 28%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.tabular, .stat-v, .nav-count, .score-num, .qno-badge, .exam-metric .v, .pstat .v, .due-badge{font-variant-numeric:tabular-nums}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none!important}
button{font:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ========== 顶栏 ========== */
.topbar{position:sticky;top:0;z-index:50;height:var(--header-h);background:var(--paper);
  border-bottom:1px solid var(--line);box-shadow:var(--sh-1)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;
  display:flex;align-items:center;gap:14px}
/* 品牌区整体可点击回首页：与「首页」按钮互为冗余入口，降低迷路概率 */
.brand-home{display:flex;align-items:center;gap:12px;min-width:0;flex:1;background:transparent;border:0;
  border-radius:var(--r-m);padding:5px 8px;margin-left:-8px;cursor:pointer;text-align:left;
  transition:background .16s}
.brand-home:hover{background:var(--cream)}
.brand-home:active{background:var(--line)}
.emblem{width:44px;height:44px;flex:0 0 44px;filter:drop-shadow(0 2px 5px rgba(184,39,45,.18))}
.emblem svg{width:100%;height:100%;display:block}
.brand{min-width:0;display:block}
.brand-title{display:block;font-size:16px;font-weight:800;color:var(--red-d);letter-spacing:.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;font-size:11px;color:var(--ink-faint);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;
  background:transparent;border:1px solid transparent;border-radius:999px;color:var(--ink-soft);
  font-size:13px;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s,box-shadow .16s}
.nav-btn svg{width:16px;height:16px;flex:0 0 16px;display:block}
.nav-btn:hover{background:var(--cream);border-color:var(--line-strong);color:var(--red-d)}
.nav-btn:active{transform:scale(.96)}
/* 当前所在页：浅底 + 描边 + 红字加粗，与其他入口明显区分 */
.nav-btn.is-active{background:var(--cream);border-color:var(--line-strong);color:var(--red-d);font-weight:700}
/* 首页：金色描边，位置固定在导航最前；激活时描边转红 */
.nav-home{border-color:var(--line-strong)}
.nav-home.is-active{border-color:var(--red);color:var(--red-d)}
/* 继续：进行中的练习，实心红主操作，与次级入口区分 */
.nav-continue{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;border-color:transparent;
  box-shadow:0 2px 8px rgba(184,39,45,.2)}
.nav-continue:hover{background:linear-gradient(135deg,var(--red-d),#7a171b);color:#fff;border-color:transparent}
.nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
  border-radius:999px;background:var(--s-due-bg);color:var(--s-due-fg);font-size:12px;font-weight:700}
.nav-help{width:44px;padding:0;justify-content:center;font-size:18px;font-weight:700;border-color:var(--line-strong)}
/* 收藏顶栏入口：星标常驻（灰线性/金填充），N=0 隐藏数字徽标 */
.nav-fav{gap:6px}
.nav-fav svg{width:16px;height:16px;display:block;fill:none;stroke:var(--fav-off);stroke-width:1.6}
.nav-fav.is-fav svg{fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
.nav-fav-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
  border-radius:999px;background:var(--fav-badge-bg);color:var(--fav-badge-fg);font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums}
.fav-sublink{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
  background:transparent;border:0;border-top:1px dashed var(--line);padding:8px 0 0;margin-top:8px;
  min-height:44px;cursor:pointer}
.fav-sublink svg{width:16px;height:16px;display:block;fill:none;stroke:var(--fav-off);stroke-width:1.6}
.fav-sublink.is-fav svg{fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
.fav-sublink:hover{color:var(--red-d)}
.fav-head-btn svg{width:16px;height:16px;display:block;fill:none;stroke:var(--fav-off);stroke-width:1.6}
.fav-head-btn.is-fav svg{fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
/* 头像入口：圆形红金 + 金环 + 白边，与外部助手头像明确区分 */
.avatar-btn{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:2px solid var(--profile-ring);
  background:var(--profile-grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 0 0 2px var(--paper),var(--sh-1);
  transition:transform .16s,box-shadow .16s}
.avatar-btn svg{width:19px;height:19px;display:block}
.avatar-btn:hover{transform:scale(1.05);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--profile-ring),var(--sh-1)}
.avatar-btn:active{transform:scale(.97)}
.avatar-btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* ========== 通用容器 ========== */
.main{max-width:1200px;margin:0 auto;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
  padding:20px;box-shadow:var(--sh-1)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;
  color:var(--red-d);margin-bottom:16px}
.sec-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gold-l)}
.card-lead{font-size:13px;color:var(--ink-soft);margin:-6px 0 16px;line-height:1.7}
.section-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:4px}
.section-label::after{content:"";height:1px;flex:1;background:var(--line)}
.start-card .segmented{margin-bottom:14px}
.start-card .btn-block svg{width:18px;height:18px;flex-basis:18px}
.tip{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:12px}

/* ========== 按钮 ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:0 18px;border-radius:var(--r-m);border:1px solid transparent;font-size:14px;
  font-weight:700;letter-spacing:.5px;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s,border-color .16s}
.btn svg{width:17px;height:17px;flex:0 0 17px;display:block}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;
  box-shadow:0 4px 12px rgba(184,39,45,.22)}
.btn-primary:hover{box-shadow:0 6px 16px rgba(184,39,45,.3)}
.btn-ghost{background:var(--paper);color:var(--red-d);border-color:var(--red)}
.btn-soft{background:var(--cream);color:var(--ink-soft);border-color:var(--line-strong)}
.btn-soft:hover{border-color:var(--gold-l);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff;border:1px solid var(--danger);font-weight:800}
.btn-danger:hover{background:var(--danger-d)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link-btn{background:none;border:0;color:var(--ink-soft);font-size:13px;text-decoration:underline;
  cursor:pointer;min-height:44px;padding:0 8px}
.link-btn:hover{color:var(--red-d)}

/* ========== 首页 ========== */
.home{display:flex;flex-direction:column;gap:16px}
.hero{padding:24px}
.hero-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hero-mark{width:40px;height:40px;border-radius:var(--r-m);background:var(--s-skip-bg);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--s-skip-fg)}
.hero-head h2{font-size:17px;color:var(--red-d)}
.hero-head p{font-size:12px;color:var(--ink-faint)}
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hstat{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;text-align:center}
.hstat .v{font-size:26px;font-weight:800;color:var(--red-d);line-height:1.2;font-variant-numeric:tabular-nums}
.hstat .k{font-size:12px;color:var(--ink-soft);margin-top:4px}
.entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.entry-card{cursor:pointer;transition:border-color .16s,box-shadow .16s,transform .16s;display:block}
.entry-card:hover{border-color:var(--gold-l);box-shadow:var(--sh-2);transform:translateY(-2px)}
.entry-card.primary{border-color:var(--red);background:linear-gradient(135deg,var(--paper),#fdf0f0)}
.entry-card .ec-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.entry-card .ec-icon{width:38px;height:38px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;font-size:19px}
.entry-card .ec-icon-star{background:var(--fav-badge-bg);color:var(--fav-on-edge)}
.entry-card .ec-icon-star svg{width:20px;height:20px;display:block;fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
.entry-card .ec-arrow{color:var(--ink-faint);font-size:18px}
.entry-card h3{font-size:16px;margin-top:12px;color:var(--ink)}
.entry-card p{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
.segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.seg{min-height:56px;border:1.5px solid var(--line-strong);background:var(--paper);border-radius:var(--r-m);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color .16s,background .16s,color .16s}
.seg:hover{border-color:var(--gold-l)}
.seg.sel{border-color:var(--red);background:#fdf0f0;color:var(--red-d)}
.seg .n{font-size:18px;font-weight:800;line-height:1.1}
.seg .l{font-size:11px;color:var(--ink-faint)}
.seg.sel .l{color:var(--red)}

/* ========== 统计条 ========== */
.statsbar{position:sticky;top:var(--header-h);z-index:40;height:var(--stats-h);
  background:rgba(255,253,249,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.statsbar-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:100%;
  display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:8px;position:relative}
.stat-cell{display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat-cell+.stat-cell{border-left:1px solid var(--line);padding-left:16px}
.stat-k{font-size:11px;color:var(--ink-faint);letter-spacing:.5px}
.stat-v{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats-fill{position:absolute;left:0;bottom:0;height:3px;width:0;border-radius:0 3px 3px 0;
  background:var(--bar-gold);transition:width .2s}

/* ========== 新手引导 ========== */
.guide-wrap{max-width:1200px;margin:14px auto 0;padding:0 24px}
.guide{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r-m);
  background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg);font-size:13px}
.guide svg{flex:0 0 18px;width:18px;height:18px}
.guide .guide-x{margin-left:auto;background:none;border:0;color:var(--tip-fg);cursor:pointer;
  min-width:44px;min-height:44px;font-size:18px}

/* ========== 练习页 ========== */
.filterbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1}
.pills::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;white-space:nowrap;
  border:1px solid var(--line-strong);background:var(--paper);border-radius:999px;cursor:pointer;
  font-size:13px;color:var(--ink-soft);transition:border-color .16s,background .16s}
.pill:hover{border-color:var(--gold-l)}
.pill.sel{border-color:var(--red);background:#fdf0f0;color:var(--red-d);font-weight:700}
.pill .pc{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.pill.sel .pc{color:var(--red)}
.search{flex:0 0 220px;position:relative}
.search input{width:100%;min-height:44px;padding:0 14px 0 34px;border:1px solid var(--line-strong);
  background:var(--paper);border-radius:999px;font-size:13px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--red)}
.search .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:14px}
.practice-layout{display:flex;gap:16px;align-items:flex-start}
.board{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sidebar{width:300px;flex:0 0 300px;position:sticky;top:calc(var(--header-h) + var(--stats-h) + 16px);
  display:flex;flex-direction:column;gap:16px}
.side-card{padding:16px}
.side-card h3{font-size:13px;color:var(--red-d);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.side-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;
  border-bottom:1px dashed var(--line)}
.side-row:last-child{border-bottom:0}
.side-row .k{color:var(--ink-soft)}
.side-row .v{font-weight:700;color:var(--ink)}
.rec{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
.rec .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.rec .rn{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rec .rt{margin-left:auto;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.side-actions{display:grid;gap:8px}
.side-actions .btn{width:100%}

/* ========== 题卡 ========== */
.qcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--sh-1);overflow:hidden;transition:border-color .16s,box-shadow .16s;
  content-visibility:auto;contain-intrinsic-size:auto 112px}
.qcard:hover{box-shadow:var(--sh-2)}
.qcard.is-open{content-visibility:visible;border-color:var(--line-strong)}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st-mark)}
.qcard.style-unanswered{--st-fg:var(--s-unanswered-fg);--st-bg:var(--s-unanswered-bg);--st-mark:var(--s-unanswered-mark)}
.qcard.style-correct{--st-fg:var(--s-correct-fg);--st-bg:var(--s-correct-bg);--st-mark:var(--s-correct-mark)}
.qcard.style-wrong{--st-fg:var(--s-wrong-fg);--st-bg:var(--s-wrong-bg);--st-mark:var(--s-wrong-mark)}
.qcard.style-skipped{--st-fg:var(--s-skip-fg);--st-bg:var(--s-skip-bg);--st-mark:var(--s-skip-mark)}
.qcard-summary{display:block;width:100%;min-height:108px;text-align:left;background:none;border:0;
  padding:16px 18px 14px 20px;cursor:pointer;color:inherit}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.qno-badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 7px;
  border-radius:var(--r-s);background:var(--cream);border:1px solid var(--line-strong);
  color:var(--red-d);font-size:12px;font-weight:800}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:var(--st-bg);color:var(--st-fg);font-size:12px;font-weight:700;white-space:nowrap}
.st-icon{font-size:12px;line-height:1}
.stem{font-size:14px;line-height:1.65;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--ink-faint)}
.blank-tag{padding:2px 8px;border-radius:999px;background:var(--cream);border:1px solid var(--line)}
.qcard-body{padding:14px 18px 18px 20px;border-top:1px dashed var(--line)}
.tip-note{display:block;background:var(--tip-bg);border:1px solid var(--tip-bd);color:var(--tip-fg);
  font-size:12px;line-height:1.6;padding:8px 12px;border-radius:var(--r-s);margin-bottom:12px}
.full-stem{font-size:15px;line-height:2.1;margin-bottom:12px;word-break:break-word}
.blank-wrap{display:inline}
.blank-input{display:inline-block;width:150px;max-width:100%;border:0;border-bottom:2px solid var(--red);
  background:#fff9ee;text-align:center;font-size:15px;color:var(--red-d);font-weight:700;
  padding:3px 8px;margin:0 4px;border-radius:var(--r-s) var(--r-s) 0 0;outline:none;
  font-family:inherit;min-height:36px}
.blank-input:focus{background:#fff1d8;border-bottom-color:var(--gold)}
.blank-input.ok{border-color:var(--s-correct-mark);background:var(--s-correct-bg);color:var(--s-correct-fg)}
.blank-input.no{border-color:var(--s-wrong-mark);background:var(--s-wrong-bg);color:var(--s-wrong-fg)}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.q-actions .btn{flex:1 1 auto;min-width:96px;padding:0 10px;font-size:13px}
.fb{padding:12px;border-radius:var(--r-s);font-size:13px;margin-top:12px;line-height:1.8}
.fb.ok{background:var(--s-correct-bg);border:1px solid #bfe3cc;color:var(--s-correct-fg)}
.fb.no{background:var(--s-wrong-bg);border:1px solid var(--danger-line);color:var(--s-wrong-fg)}
.fb>b{display:block;margin-bottom:4px;font-size:14px}
.fb-row{padding:2px 0}
.ans-mark{background:var(--s-correct-bg);color:var(--s-correct-fg);padding:1px 6px;border-radius:var(--r-s);font-weight:700}
.review-meta{font-size:12px;color:var(--ink-soft);background:var(--cream);border-radius:var(--r-s);padding:8px 10px;margin-top:10px}

/* ========== 悬浮/底栏 ========== */
.fab{position:fixed;right:24px;bottom:24px;z-index:30;min-height:48px;padding:0 22px;border-radius:999px;
  border:0;background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;font-weight:800;font-size:14px;
  cursor:pointer;box-shadow:var(--sh-2);transition:transform .16s}
.fab:hover{transform:translateY(-2px)}
.mobile-bottom{display:none}

/* ========== 结果页 ========== */
.score{text-align:center;padding:8px 0 4px}
.score-num{font-size:56px;font-weight:800;color:var(--red-d);line-height:1.1}
.score-lbl{font-size:13px;color:var(--ink-soft)}
.score-badge{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;
  background:var(--s-correct-bg);color:var(--s-correct-fg);font-size:12px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.gstat{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:center}
.gstat .v{font-size:20px;font-weight:800;color:var(--red-d);line-height:1.2;font-variant-numeric:tabular-nums}
.gstat .k{font-size:11px;color:var(--ink-soft);margin-top:2px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.result-actions .btn{flex:1 1 160px}
.wrong-review{margin-top:20px}
.rev-item{padding:14px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.9}
.rev-item:last-child{border-bottom:0}
.rev-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.rev-no{color:var(--red-d);font-weight:800}
.rev-time{margin-left:auto;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.your-tag{background:var(--s-wrong-bg);color:var(--s-wrong-fg);padding:1px 8px;border-radius:var(--r-s);font-weight:700}
.ok-tag{background:var(--s-correct-bg);color:var(--s-correct-fg);padding:1px 8px;border-radius:var(--r-s);font-weight:700}
.empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.empty-art{width:120px;height:96px;display:block;margin:0 auto 12px}
.empty-state h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.empty-state p{font-size:13px;margin-bottom:18px;line-height:1.7}

/* ========== 错题本 · 考试分组 ========== */
.wb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.wb-head h2{font-size:18px;color:var(--red-d)}
.wb-head p{font-size:12px;color:var(--ink-soft);margin-top:2px}
.wb-head .btn{flex-shrink:0}
.wb-notice{background:var(--s-correct-bg);color:var(--s-correct-fg);border:1px solid #bfe3cc;
  border-radius:var(--r-s);padding:8px 12px;font-size:12px;margin-bottom:12px}
.exam-list{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.exam-list:focus{outline:none}
.exam-card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);
  padding:16px 18px 16px 20px;transition:border-color .16s,box-shadow .16s}
.exam-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;
  border-radius:0 2px 2px 0;background:var(--exam-spine)}
.exam-card.is-expanded{border-color:var(--line-strong);box-shadow:var(--sh-1)}
.exam-head{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px}
.exam-toggle-hit{position:absolute;inset:0;width:100%;z-index:1;background:transparent;border:0;cursor:pointer;border-radius:var(--r-s)}
.exam-toggle-hit:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.exam-head-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none;min-width:0}
.exam-head-info.left{flex:1 1 auto}
.exam-head-info.right{flex:0 0 auto}
.exam-badge{background:#fdf0f0;color:var(--red-d);font-size:12px;font-weight:800;
  padding:3px 8px;border-radius:var(--r-s);white-space:nowrap}
.exam-time{background:var(--exam-time-bg);color:var(--exam-time-fg);font-size:12px;
  padding:3px 8px;border-radius:999px;white-space:nowrap}
.due-badge{background:var(--s-due-bg);color:var(--s-due-fg);font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:999px;white-space:nowrap}
.exam-rate-quick{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.exam-chevron{color:var(--ink-faint);font-size:16px;line-height:1;display:inline-block;
  transition:transform .16s}
.exam-card.is-expanded .exam-chevron{transform:rotate(180deg)}
.del-exam{position:relative;z-index:2;display:inline-flex;align-items:center;gap:4px;min-height:44px;
  padding:4px 8px;border-radius:var(--r-s);border:1px solid transparent;background:transparent;
  color:var(--ink-faint);font-size:12px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .16s,background .16s,color .16s,border-color .16s}
.del-exam svg{width:14px;height:14px}
.exam-card:hover .del-exam,.exam-card:focus-within .del-exam,.del-exam:focus-visible{opacity:1;pointer-events:auto}
.del-exam:hover,.del-exam:focus-visible{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.del-exam:active{background:#f7d5d0}
.del-exam:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.exam-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;
  padding-top:12px;border-top:1px dashed var(--line);text-align:center}
.exam-metric{min-width:0}
.exam-metric+.exam-metric{border-left:1px solid var(--line)}
.exam-metric .k{display:block;font-size:11px;color:var(--ink-faint)}
.exam-metric .v{display:block;font-size:20px;font-weight:800;color:var(--red-d);line-height:1.3}
.rate-track{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}
.rate-fill{height:100%;border-radius:999px;background:var(--bar-gold);width:0;transition:width .16s}
.exam-wrongs{margin:12px 0 2px 16px;padding-left:16px;border-left:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;animation:wbIn .16s ease-out}
@keyframes wbIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.all-done-note{font-size:12px;color:var(--s-correct-fg);padding:4px 2px}
.all-done-head{font-size:11px;color:var(--s-correct-fg);font-weight:700;white-space:nowrap}
.wb-item{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);
  padding:12px 14px;box-shadow:none;transition:opacity .16s,border-color .16s}
.wb-item:hover{border-color:var(--line-strong)}
.wb-item.is-removing{opacity:.5;pointer-events:none}
.wb-item.is-mastered{background:var(--cream)}
.wb-item-top{display:flex;align-items:center;gap:8px}
.due-chip,.done-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:700;white-space:nowrap}
.due-chip{background:var(--s-due-bg);color:var(--s-due-fg)}
.done-chip{background:var(--s-correct-bg);color:var(--s-correct-fg)}
.del-item{position:relative;margin-left:auto;width:28px;height:28px;display:inline-flex;align-items:center;
  justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--r-s);
  color:var(--ink-faint);opacity:.55;cursor:pointer;flex:0 0 28px;
  transition:opacity .16s,background .16s,color .16s,border-color .16s,transform .16s}
.del-item::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.del-item svg{width:16px;height:16px;pointer-events:none}
.del-item:hover,.del-item:focus-visible{opacity:1;background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.del-item:active{background:#f7d5d0;transform:scale(.94)}
.del-item:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* 收藏星标图标按钮：与删除按钮左右分置，非破坏性，不碰红 */
.fav-icon-btn{position:relative;width:28px;height:28px;flex:0 0 28px;display:inline-flex;align-items:center;
  justify-content:center;background:transparent;border:1px solid transparent;border-radius:var(--r-s);
  color:var(--ink-faint);opacity:.7;cursor:pointer;
  transition:opacity .16s,background .16s,border-color .16s,transform .16s}
.fav-icon-btn::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.fav-icon-btn svg{width:16px;height:16px;display:block;fill:none;stroke:var(--fav-off);stroke-width:1.6;pointer-events:none}
.fav-icon-btn.is-fav{opacity:1}
.fav-icon-btn.is-fav svg{fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
.fav-icon-btn:hover,.fav-icon-btn:focus-visible{opacity:1;background:rgba(217,165,52,.12);border-color:var(--tip-bd)}
.fav-icon-btn:hover svg,.fav-icon-btn:focus-visible svg{stroke:var(--fav-hover)}
.fav-icon-btn.is-fav:hover svg,.fav-icon-btn.is-fav:focus-visible svg{stroke:var(--fav-on-edge)}
.fav-icon-btn:active{transform:scale(.94)}
.fav-icon-btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fav-icon-btn.is-pop svg{animation:fav-pop .18s ease-out}
@keyframes fav-pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
/* 答题反馈「收藏这道题」文字切换按钮 */
.fav-text-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;
  border:1px solid var(--tip-bd);border-radius:var(--r-s);background:var(--paper);color:var(--ink-soft);
  font-size:13px;font-weight:700;cursor:pointer;
  transition:background .16s,border-color .16s,color .16s,transform .16s}
.fav-text-btn svg{width:20px;height:20px;display:block;fill:none;stroke:var(--fav-off);stroke-width:1.6}
.fav-text-btn.is-fav{background:rgba(217,165,52,.12);border-color:var(--fav-on);color:var(--tip-fg)}
.fav-text-btn.is-fav svg{fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
.fav-text-btn:hover{background:rgba(217,165,52,.16)}
.fav-text-btn:active{transform:scale(.98)}
.fav-text-btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fav-text-btn.is-pop svg{animation:fav-pop .18s ease-out}
/* 收藏列表卡：金书脊区别于考试卡红书脊；订正维度与收藏维度并列 */
.fav-item{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--fav-on);
  border-radius:var(--r-m);padding:12px 14px 12px 16px;box-shadow:none;transition:opacity .16s,border-color .16s}
.fav-item:hover{border-color:var(--line-strong);border-left-color:var(--fav-on)}
.fav-item.is-removing{opacity:.5;pointer-events:none}
.fav-item .fav-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;
  padding:0 10px;border:1px solid var(--fav-on);border-radius:var(--r-s);
  background:rgba(217,165,52,.12);color:var(--tip-fg);font-size:13px;font-weight:700;cursor:pointer;
  transition:background .16s,color .16s,border-color .16s,transform .16s}
.fav-item .fav-toggle svg{width:20px;height:20px;display:block;fill:var(--fav-on);stroke:var(--fav-on-edge);stroke-width:1.4}
.fav-item .fav-toggle:hover{background:var(--cream);color:var(--ink-soft);border-color:var(--line-strong)}
.fav-item .fav-toggle:hover svg{fill:none;stroke:var(--fav-off);stroke-width:1.6}
.fav-item .fav-toggle:active{transform:scale(.98)}
.fav-item .fav-toggle:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fav-list{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.fav-list:focus{outline:none}
.fav-empty-star{stroke:var(--gold-l);stroke-width:2.4}
/* 无来源两态：中性弱化文字，绝不显示红色场次徽标/邮戳 */
.fav-src-note{font-size:12px;color:var(--ink-faint)}
/* 错题子卡：星标靠右、垃圾桶紧随其后，两种标记分色分形 */
.wb-item-top .fav-icon-btn{margin-left:auto}
.wb-item-top .del-item{margin-left:0}
/* 收藏卡切换按钮：默认「已收藏」，hover/focus 预告「取消收藏」 */
.fav-item .fav-hover-label{display:none}
.fav-item .fav-toggle:hover .fav-label,.fav-item .fav-toggle:focus-visible .fav-label{display:none}
.fav-item .fav-toggle:hover .fav-hover-label,.fav-item .fav-toggle:focus-visible .fav-hover-label{display:inline}
.wb-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wb-head-actions .btn{flex-shrink:0}
.wb-item-stem{font-size:14px;line-height:1.65;color:var(--ink);margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wb-item-meta{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.6}
.wb-item-actions{margin-top:2px}
.mini-empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:18px 8px;line-height:1.7}
.mini-empty svg{width:56px;height:44px;display:block;margin:0 auto 6px}
.load-more{display:block;margin:16px auto 0}

/* ========== 弹窗 / Toast ========== */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(51,46,42,.48);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r-l);
  box-shadow:var(--sh-2);width:100%;max-width:480px;max-height:85vh;overflow:auto;padding:24px;outline:none}
.modal.modal-profile{max-width:560px}
.modal.modal-del{max-width:400px}
.modal.modal-del-exam{max-width:440px}
.modal-del-exam .btn-danger{flex:2 1 auto}
.modal h2{font-size:18px;color:var(--ink);margin-bottom:12px;line-height:1.5}
.modal p{font-size:14px;color:var(--ink-soft);line-height:1.8;margin-bottom:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1 1 auto}
.title-with-icon{display:flex;align-items:center;gap:8px}
.title-with-icon svg{width:20px;height:20px;color:var(--danger);flex:0 0 20px}
.danger-banner{background:var(--danger-bg);border:1px solid var(--danger-line);border-radius:var(--r-s);
  padding:10px 12px;color:var(--danger);font-size:13px;font-weight:700;margin-bottom:14px}
.archive-error{color:var(--danger);font-weight:700;font-size:13px!important}
.archive-note{color:var(--s-due-fg);font-size:13px!important;font-weight:700}
.legend{display:grid;gap:8px;margin:12px 0}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13px}
.legend-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px}
.kbd{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:var(--r-s);background:var(--cream);font-size:12px;
  font-family:ui-monospace,monospace;color:var(--ink)}
.rule-box{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;font-size:13px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:120;
  background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#fff;font-weight:700;cursor:pointer;
  text-decoration:underline;min-height:32px;white-space:nowrap}

/* ========== 个人数据面板 ========== */
.profile-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.profile-av{width:56px;height:56px;flex:0 0 56px;border-radius:50%;border:2px solid var(--profile-ring);
  background:var(--profile-grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--paper),var(--sh-1)}
.profile-av svg{width:28px;height:28px}
.profile-name{font-size:16px;font-weight:800;color:var(--ink)}
.profile-sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.modal-x{margin-left:auto;align-self:flex-start;background:none;border:0;color:var(--ink-faint);
  font-size:22px;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.modal-x:hover{color:var(--red-d)}
.best-row{display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--line);
  border-radius:var(--r-s);padding:8px 12px;font-size:12px;color:var(--ink-soft);margin-top:16px}
.best-row svg{width:16px;height:16px;color:var(--gold);flex:0 0 16px}
.best-row b{margin-left:auto;font-size:16px;font-weight:800;color:var(--red-d)}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pstat{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 10px;text-align:center}
.pstat .ico{display:block;height:18px;margin-bottom:4px;color:var(--red-d)}
.pstat .ico svg{width:17px;height:17px}
.pstat .v{display:block;font-size:26px;font-weight:800;color:var(--red-d);line-height:1.2}
.pstat .k{display:block;font-size:12px;color:var(--ink-faint);margin-top:4px}
.pstat.is-danger .ico,.pstat.is-danger .v{color:var(--danger)}
.pstat.is-good .ico,.pstat.is-good .v{color:var(--s-correct-fg)}
.pstat .mini-track{height:4px;border-radius:999px;background:var(--line);margin:6px auto 0;width:80%;overflow:hidden}
.pstat .mini-fill{height:100%;border-radius:999px;background:var(--bar-gold)}
.recent-block{margin-top:18px}
.recent-title{font-size:13px;font-weight:700;color:var(--red-d);margin-bottom:8px}
.recent-item{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 10px;
  background:var(--cream);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:6px;
  cursor:pointer;text-align:left;transition:border-color .16s}
.recent-item:hover{border-color:var(--gold-l)}
.recent-item .exam-badge{font-size:11px}
.recent-item .rt{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.recent-item .rr{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.recent-item .rtrack{width:48px;height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.recent-item .rfill{height:100%;background:var(--bar-gold)}
.recent-item .rchev{color:var(--ink-faint);font-size:16px}
.data-note{margin-top:16px;font-size:11px;color:var(--ink-faint);line-height:1.7;
  background:var(--cream);border-radius:var(--r-s);padding:8px 10px}
.footer{text-align:center;color:var(--ink-faint);font-size:12px;padding:8px 0 28px}

/* ========== 响应式 ========== */
@media(min-width:1440px){
  .topbar-inner,.statsbar-inner,.main,.guide-wrap{max-width:1280px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:1023px){
  .practice-layout{flex-direction:column;align-items:stretch}
  .board{width:100%}
  .sidebar{width:100%;flex:none;position:static;display:block}
  #sidebarBody{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
}
@media(max-width:767px){
  :root{--header-h:52px;--stats-h:48px}
  .topbar-inner,.statsbar-inner,.main{padding-left:14px;padding-right:14px}
  .main{padding-top:14px;padding-bottom:96px}
  .guide-wrap{padding-left:14px;padding-right:14px}

function normalizeExam(e){
  if(!e || typeof e!=="object" || !Array.isArray(e.queue) || !e.answers ||
     typeof e.answers!=="object" || Array.isArray(e.answers) || !Array.isArray(e.wrongItems)) return null;
  const out = Object.assign({}, e, {
    queue: e.queue.filter(n=>QUIZ_BY_NO[n]),
    wrongItems: e.wrongItems.filter(w=>w && QUIZ_BY_NO[w.no])
  });
  if(!out.stats || typeof out.stats!=="object" || Array.isArray(out.stats)){
    out.stats = sessionStats({queue:out.queue, answers:out.answers});
  }
  if(typeof out.seq!=="number" || !isFinite(out.seq)) out.seq = 1;
  if(typeof out.elapsedMs!=="number") out.elapsedMs = 0;
  if(typeof out.createdAt!=="number") out.createdAt = Date.now();
  if(typeof out.id!=="string" || !out.id) out.id = "e"+out.createdAt;
  out.wrongItems = out.wrongItems.map(w=>Object.assign({
    no:w.no, mastered:false, masteredAt:null,
    lastWrongAt:out.createdAt, lastUser:[], blankWrong:0
  }, w));
  return out;
}
// 损坏 exams 条目过滤 + 回写，保证渲染不崩
(function sanitizeExams(){
  if(!Array.isArray(state.exams)) state.exams = [];
  const clean = state.exams.map(normalizeExam).filter(Boolean).slice(0,20);
  state.exams = clean;
  if(rawGet("exams")!==null || clean.length){
    const back = store.get("exams", null);
    if(!Array.isArray(back) || back.length!==clean.length ||
       back.some((x,i)=>JSON.stringify(x)!==JSON.stringify(clean[i]))) store.set("exams", clean);
  }
})();
// 收藏：题号级独立集合 { [no]:{at} }；脏数据清洗后回写，与旧 wrong 迁移完全隔离
function isPlainObject(o){ return !!o && typeof o==="object" && !Array.isArray(o); }
(function sanitizeFavs(){
  const raw=rawGet("favs");
  if(!isPlainObject(state.favs)) state.favs={};
  const clean={};
  Object.keys(state.favs).forEach(k=>{
    const no=+k, v=state.favs[k];
    if(!QUIZ_BY_NO[no] || !isPlainObject(v) || typeof v.at!=="number" || !isFinite(v.at)) return;
    if(!clean[no] || v.at>clean[no].at) clean[no]={at:v.at};
  });
  state.favs=clean;
  if(raw!==null){
    const back=store.get("favs",null);
    const same=isPlainObject(back) &&
      Object.keys(back).length===Object.keys(clean).length &&
      Object.keys(clean).every(k=>back[k]&&back[k].at===clean[k].at);
    if(!same) store.set("favs",clean);
  }
})();
// 场次序号：缺失时从现有 exams 推导，保证删除后不回收
if(typeof state.prefs.examSeq!=="number" || !isFinite(state.prefs.examSeq) || state.prefs.examSeq<0){
  state.prefs.examSeq = state.exams.reduce((m,e)=>Math.max(m, Number(e.seq)||0), 0);
  store.set("prefs", state.prefs);
}

})();

/* ==================== 5. 判题算法（原样保留） ==================== */
function normalize(s){return (s||'').replace(/[\s，。、；：""''（）()《》,.!?！？\-—]/g,'').toLowerCase();}
function judge(user, ans){
  const a=normalize(ans), u=normalize(user);
  if(!u) return false;
  if(a===u) return true;
  if(a.length>=4 && (a.includes(u)||u.includes(a)) && Math.abs(a.length-u.length)<=Math.max(2,a.length*0.3)) return true;
  let hit=0; const seen=new Set();
  for(const ch of u){ if(a.includes(ch)&&!seen.has(ch)){hit++;seen.add(ch);} }
  return hit/Math.max(a.length,1) >= 0.8;
}

/* ==================== 6. 工具 / 派生计数（唯一真相源 exams） ==================== */
function escapeHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtTime(ms){ const s=Math.max(0,Math.floor((ms||0)/1000)); return pad2(Math.floor(s/60))+":"+pad2(s%60); }
function fmtDuration(ms){ const s=Math.max(0,Math.floor((ms||0)/1000)); return pad2(Math.floor(s/3600))+":"+pad2(Math.floor((s%3600)/60))+":"+pad2(s%60); }
function fmtDateTime(ts){
  const d=new Date(ts||0);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function stemText(q){ return q.segs.map(s=> ("t" in s)? s.t : "＿＿").join(""); }
function answerHtml(q){ return q.segs.map(s=> ("t" in s)? escapeHtml(s.t) : '<mark class="ans-mark">'+escapeHtml(s.a)+'</mark>').join(""); }
function statusOf(no){ const a=state.session && state.session.answers[no]; return (a && a.status) ? a.status : "unanswered"; }
function isSubmitted(no){ const st=statusOf(no); return st==="correct"||st==="wrong"; }

function allItems(){
  return state.exams.reduce((acc,e)=>{
    (e.wrongItems||[]).forEach(w=>acc.push(Object.assign({}, w, {examId:e.id, seq:e.seq})));
    return acc;
  },[]);
}
function activeItems(){ return allItems().filter(w=>!w.mastered); }
function activeWrongNos(){ return Array.from(new Set(activeItems().map(w=>w.no))).sort((a,b)=>a-b); }
function activeWrongCount(){ return activeItems().length; }
function masteredCount(){ return allItems().filter(w=>w.mastered).length; }
function examActiveCount(e){ return (e.wrongItems||[]).filter(w=>!w.mastered).length; }
function wrongTimes(no){ return allItems().filter(w=>w.no===no).length; }
function isActiveWrong(no){ return activeItems().some(w=>w.no===no); }
/* 收藏派生（唯一数据源 state.favs，题号级 { no:{at} }） */
function isFav(no){ return Object.prototype.hasOwnProperty.call(state.favs,no); }
function favCount(){ return Object.keys(state.favs).length; }
function favNos(){ return Object.keys(state.favs).map(Number); }
function favWrongTimes(no){ return wrongTimes(no); }
function favItems(){
  return favNos().map(no=>{
    const related=allItems().filter(w=>w.no===no);
    const src=related.slice().sort((a,b)=>(b.lastWrongAt||0)-(a.lastWrongAt||0))[0]||null;
    const everArchived=state.exams.some(e=>(e.queue||[]).indexOf(no)>=0) ||
      state.history.some(h=>(h.queue||[]).indexOf(no)>=0);
    const srcKind=src?"exam":(everArchived?"orphan":"practicing");
    return {no,at:(state.favs[no]||{}).at||0,src,srcKind,
      wrongTimes:wrongTimes(no),active:isActiveWrong(no),
      mastered:related.length>0&&!isActiveWrong(no)};
  }).sort((a,b)=>(b.at-a.at)||(a.no-b.no));
}

function bestRate(){
  const rs=state.exams.map(e=>e.stats&&e.stats.rate).filter(r=>typeof r==="number" && isFinite(r));
  return rs.length ? Math.max.apply(null,rs) : null;
}

function sessionStats(s){
  let correct=0,wrong=0,skipped=0;
  s.queue.forEach(no=>{
    const a=s.answers[no]; if(!a||!a.status) return;
    if(a.status==="correct") correct++; else if(a.status==="wrong") wrong++; else if(a.status==="skipped") skipped++;
  });
  const processed=correct+wrong+skipped, submitted=correct+wrong;
  return {total:s.queue.length,correct,wrong,skipped,processed,submitted,
    rate: submitted? Math.round(correct/submitted*100) : null,
    coverage: s.queue.length? Math.round(processed/s.queue.length*100) : 0};
}
function cumulativeStats(){
  let processed=0,correct=0,submitted=0,elapsed=0;
  state.history.forEach(h=>{
    const st=h.stats || sessionStats({queue:h.queue||[],answers:h.answers||{}});
    processed+=st.processed; correct+=st.correct; submitted+=st.submitted; elapsed+=(h.elapsedMs||0);
  });
  return {processed,elapsed,rate: submitted? Math.round(correct/submitted*100) : null};
}
function modeLabel(mode){ return mode==="redo" ? "错题重做" : ((mode+" 题")||"练习"); }

/* ==================== 7. 持久化校验 / 会话管理 ==================== */
function sameIds(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
  const f=x=>x&&x.id?x.id:"";
  return a.map(f).sort().join("|")===b.map(f).sort().join("|");
}
// 写存储 → 回读校验 → 再改内存；失败返回 false 且不改内存
function persistExams(next){
  store.set("exams",next);
  let back=null; try{ back=JSON.parse(rawGet("exams")||"null"); }catch(e){}
  if(!sameIds(back,next) || (next.length && (!back[0] || back[0].id!==next[0].id))) return false;
  if(back.some((e,i)=>!Array.isArray(e.wrongItems) || e.wrongItems.length!==next[i].wrongItems.length)) return false;
  state.exams=next; return true;
}
function buildExam(s){
  const st=sessionStats(s);
  const createdAt=Date.now();
  const answers=JSON.parse(JSON.stringify(s.answers||{}));
  const queue=(s.queue||[]).slice();
  const seq=(Number(state.prefs.examSeq)||0)+1;
  const wrongItems=queue.filter(no=>answers[no] && answers[no].status==="wrong").map(no=>{
    const a=answers[no], details=Array.isArray(a.details)?a.details:[];
    return {
      no, mastered:false, masteredAt:null,
      lastWrongAt:a.at||createdAt,
      lastUser:details.map(d=>d.user||""),
      blankWrong:details.filter(d=>!d.ok).length
    };
  });
  return {
    id:"e"+Date.now()+pad2(Math.floor(Math.random()*100)),
    seq, createdAt, startedAt:s.startedAt||createdAt, mode:String(s.mode),
    queue, answers, stats:st, elapsedMs:s.elapsedMs||0, wrongItems
  };
}
// 交卷原子归档：exams / history / prefs 一次性写，校验成功后才清 session
function archiveActive(){
  const s=state.session; if(!s) return false;
  const st=sessionStats(s);
  const exam=buildExam(s);
  const entry={id:s.id,mode:s.mode,queue:s.queue.slice(),
    answers:JSON.parse(JSON.stringify(s.answers)),elapsedMs:s.elapsedMs||0,
    endedAt:exam.createdAt,stats:st};
  const oldExams=state.exams.slice(), oldHistory=state.history.slice(), oldPrefs=Object.assign({},state.prefs);
  const newExams=[exam].concat(state.exams).slice(0,20);
  const newHistory=[entry].concat(state.history).slice(0,20);
  const newPrefs=Object.assign({},state.prefs,{examSeq:exam.seq});
  store.set("exams",newExams); store.set("history",newHistory); store.set("prefs",newPrefs);
  let be=null,bh=null,bp=null;
  try{ be=JSON.parse(rawGet("exams")||"null"); }catch(e){}
  try{ bh=JSON.parse(rawGet("history")||"null"); }catch(e){}
  try{ bp=JSON.parse(rawGet("prefs")||"null"); }catch(e){}
  const ok = !!(be && be.length===newExams.length && be[0] && be[0].id===exam.id &&
                bh && bh.length===newHistory.length && bh[0] && bh[0].id===entry.id &&
                bp && bp.examSeq===exam.seq);
  if(!ok){
    store.set("exams",oldExams); store.set("history",oldHistory); store.set("prefs",oldPrefs);
    return false;
  }
  state.exams=newExams; state.history=newHistory; state.prefs=newPrefs;
  state.session=null; store.del("session");
  return true;
}
function newSession(mode, nos){
  if(state.session && !archiveActive()) { announce("保存失败，请重试"); return false; }
  let queue;
  if(Array.isArray(nos) && nos.length) queue=nos.slice();
  else queue=shuffle(QUIZ.map(q=>q.no)).slice(0, Math.min(mode, TOTAL_Q));
  state.session={id:"s"+Date.now(),mode:String(mode),queue,answers:{},drafts:{},elapsedMs:0,
    startedAt:Date.now(),filter:{status:"all",query:""},expanded:null,createdAt:Date.now()};
  saveSession();
  return true;
}
function startMode(n){
  if(!newSession(n)) return;
  state.route="practice"; location.hash="#/practice"; render();
}
function startRedo(){
  const nos=activeWrongNos();
  if(!nos.length){ announce("错题本为空"); return; }
  if(!newSession("redo", nos)) return;
  state.route="practice"; location.hash="#/practice"; render();
  announce("已开始错题重做，共 "+nos.length+" 题");
}
function startRedoNos(nos){
  const fresh=nos.filter(isActiveWrong);
  if(!fresh.length){ announce("这些错题已订正"); return; }
  if(!newSession("redo", fresh)) return;
  go("#/practice");
  announce("已开始重做 "+fresh.length+" 道错题");
}

/* ==================== 8. 计时器 ==================== */
let lastTick=Date.now(), tickHandle=null, lastPersist=Date.now();
function startTicker(){
  if(tickHandle) return;
  tickHandle=setInterval(()=>{
    const now=Date.now(), dt=now-lastTick; lastTick=now;
    if(document.visibilityState!=="visible") return;
    const s=state.session;
    if(state.route!=="practice" || !s) return;
    s.elapsedMs=(s.elapsedMs||0)+dt;
    if(s.expanded!=null && (!s.answers[s.expanded] || !s.answers[s.expanded].status)){
      const a=s.answers[s.expanded] || {};
      a.timeMs=(a.timeMs||0)+dt; s.answers[s.expanded]=a;
    }
    updateStatsBarText();
    if(now-lastPersist>5000){ saveSession(); lastPersist=now; }
  },1000);
}
document.addEventListener("visibilitychange",()=>{ lastTick=Date.now(); saveSession(); });

function matchQuery(no, query){
  const tokens=(query||"").trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const q=QUIZ_BY_NO[no];
  const text=q.segs.map(s=> ("t" in s)? s.t : s.a).join("");
  return tokens.every(tk=> /^\d+$/.test(tk) ? no===parseInt(tk,10) : text.indexOf(tk)>=0);
}
function renderGrid(){
  const grid=$("grid"); if(!grid) return;
  const empty=$("gridEmpty");
  const s=state.session; if(!s) return;
  let searched=s.queue.filter(no=>matchQuery(no,s.filter.query));
  const counts={all:searched.length,unanswered:0,correct:0,wrong:0,skipped:0,wrongbook:0};
  searched.forEach(no=>{ const st=statusOf(no); if(counts[st]!=null) counts[st]++; if(isActiveWrong(no)) counts.wrongbook++; });
  document.querySelectorAll("[data-pill]").forEach(el=>{ el.textContent=counts[el.dataset.pill]||0; });
  const f=s.filter.status;
  if(f!=="all") searched=searched.filter(no=> f==="wrongbook" ? isActiveWrong(no) : statusOf(no)===f);
  if(!searched.length){
    grid.innerHTML="";
    if(empty){
      empty.classList.remove("hidden");
      const isSearch=!!s.filter.query.trim();
      empty.innerHTML='<div class="card empty-state">'+(isSearch?ICON.search:artCheck())+
        '<h3>'+(isSearch?"没有匹配的题目":"当前筛选下暂无题目")+'</h3>'+
        '<p>'+(isSearch?"换个题号或关键词试试":"切换到「全部」查看更多题目")+'</p>'+
        (isSearch?'<button class="btn btn-soft" data-act="clear-search">清空搜索</button>':'')+'</div>';
    }
    return;
  }
  if(empty) empty.classList.add("hidden");
  grid.innerHTML=searched.map(no=>renderCard(no)).join("");
  const first=grid.querySelector('.qcard.is-open .blank-input:not([readonly])');
  if(first && !state.skipFocus){ first.focus(); }
  state.skipFocus=false;
}
function renderCard(no){
  const q=QUIZ_BY_NO[no], s=state.session;
  const status=statusOf(no);
  const st=STATUS[status] || STATUS.unanswered;
  const ans=s ? s.answers[no] : null;
  const open=!!(s && s.expanded===no);
  const blanks=q.answers.length;
  return '<article class="qcard style-'+status+(open?' is-open':'')+'" data-no="'+no+'">'+
    '<div class="qcard-summary" role="button" tabindex="0" data-act="toggle-card" data-no="'+no+'"'+
      ' aria-expanded="'+!!open+'" aria-label="第'+no+'题，状态'+st.label+'，'+blanks+'个空，'+(open?'收起':'展开')+'">'+
      '<div class="card-head"><span class="qno-badge">'+no+'</span>'+
        '<span class="status-chip"><span class="st-icon" aria-hidden="true">'+st.icon+'</span><span>'+st.label+'</span></span></div>'+
      '<div class="stem">'+escapeHtml(stemText(q))+'</div>'+
      '<div class="card-meta"><span class="blank-tag">'+blanks+' 空</span>'+
        (ans&&ans.timeMs?'<span>用时 '+fmtTime(ans.timeMs)+'</span>':'')+'</div></div>'+

function renderCardBody(no,q,ans){
  const submitted=ans && (ans.status==="correct"||ans.status==="wrong");

  html+='<div class="full-stem">';
  let ai=0;
  q.segs.forEach(seg=>{
    if("t" in seg) html+=escapeHtml(seg.t);
    else{
      const val=submitted ? (ans.values[ai]||"") : ((state.session.drafts[no]||[])[ai]||"");
      const cls=submitted ? (ans.details[ai]&&ans.details[ai].ok?"ok":"no") : "";
      html+='<label class="blank-wrap"><span class="sr-only">第'+(ai+1)+'空</span>'+
        '<input class="blank-input '+cls+'" data-blank="'+ai+'" data-no="'+no+'" value="'+escapeHtml(val)+'"'+
        (submitted?' readonly':'')+' autocomplete="off" aria-label="第'+(ai+1)+'空"></label>';
      ai++;

/* ==================== 13. 视图行为 ==================== */
function toggleCard(no){
  const s=state.session; if(!s) return;
  s.expanded = s.expanded===no ? null : no;
  saveSessionSoon(); renderGrid();
}
function submitCard(no){
  const s=state.session, q=QUIZ_BY_NO[no]; if(!s||!q) return;
  const details=[]; let allRight=true;
  q.segs.forEach(seg=>{
    if("a" in seg){
      const idx=details.length;
      const u=((s.drafts[no]||[])[idx]||"").trim();
      const ok=judge(u,seg.a);
      if(!ok) allRight=false;
      details.push({ans:seg.a,user:u,ok});
    }
  });
  const prev=s.answers[no]||{};
  s.answers[no]={status:allRight?"correct":"wrong",values:details.map(d=>d.user),details,
    timeMs:prev.timeMs||0,at:Date.now()};
  if(allRight && s.mode==="redo") masterWrong(no);
  saveSession();
  updateHeaderCounts(); updateStatsBarText(); renderGrid(); renderSidebar();
  announce("第"+no+"题"+(allRight?"回答正确":"回答错误"));
}
function skipCard(no){
  const s=state.session; if(!s) return;
  s.answers[no]={status:"skipped",values:[],details:[],timeMs:(s.answers[no]&&s.answers[no].timeMs)||0,at:Date.now()};
  s.expanded=null; saveSession();
  updateStatsBarText(); renderGrid(); renderSidebar();
  announce("第"+no+"题已跳过");
}
function redoCard(no){
  const s=state.session; if(!s) return;
  delete s.answers[no];
  s.drafts[no]=(s.drafts[no]||[]).map(()=>"");
  s.expanded=no; saveSession();
  updateStatsBarText(); renderGrid(); renderSidebar();
  announce("第"+no+"题已重置，可重新作答");
}
function nextCard(){
  const s=state.session; if(!s) return;
  const q=s.queue, cur=q.indexOf(s.expanded);
  for(let k=1;k<=q.length;k++){
    const no=q[(cur+k+q.length)%q.length];
    if(statusOf(no)==="unanswered"){ s.expanded=no; saveSessionSoon(); renderGrid(); announce("已定位到第"+no+"题"); return; }
  }
  announce("本轮已无未答题目");
}
function moveCard(dir){
  const s=state.session; if(!s||!s.queue.length) return;
  const q=s.queue, cur=q.indexOf(s.expanded);
  const next=cur<0 ? (dir>0?0:q.length-1) : (cur+dir+q.length)%q.length;
  s.expanded=q[next]; saveSessionSoon(); renderGrid();
  announce("第"+q[next]+"题");
}
// 答对：把所有 exams 中同题号的未订正子项一次性订正；撤销按 uid 全量回滚
function masterWrong(no){
  const before=state.exams;
  const uids=[];
  before.forEach(e=>e.wrongItems.forEach(w=>{ if(w.no===no && !w.mastered) uids.push(e.id+":"+no); }));
  if(!uids.length) return;
  const stamp=Date.now();
  const next=before.map(e=>Object.assign({},e,{wrongItems:e.wrongItems.map(w=>
    (w.no===no && !w.mastered) ? Object.assign({},w,{mastered:true,masteredAt:stamp}) : w)}));
  if(!persistExams(next)){ announce("保存失败，订正未生效"); return; }
  updateHeaderCounts();
  showToast("第"+no+"题已订正，当前待订正 "+activeWrongCount()+" 题",{undo:()=>{
    if(!persistExams(before)){ announce("撤销失败，请重试"); return; }
    updateHeaderCounts(); if(state.route==="wrongbook"){ render(); focusExamList(); }
    announce("已撤销订正，当前待订正 "+activeWrongCount()+" 题");
  },duration:5000});
  announce("第"+no+"题已订正，当前待订正 "+activeWrongCount()+" 题");
}

    n=document.createElement("p"); n.className="archive-error";
    const acts=modal.querySelector(".modal-actions");
    if(acts) modal.insertBefore(n,acts); else modal.appendChild(n);
  }

function openFinishConfirm(){
  const s=state.session; if(!s) return;
  const st=sessionStats(s);
  if(st.processed===0){
    openModal('<h2>无法交卷</h2><p>本轮尚未处理任何题目（未作答、未跳过）。请先完成至少一题后再交卷。</p>'+
      '<div class="modal-actions"><button class="btn btn-primary" data-act="close-modal" data-autofocus>知道了</button></div>');
    return;
  }
  const rest=st.total-st.processed;
  const body= rest>0
    ? '还有 <b>'+rest+'</b> 题未处理（将按未作答计）。<br>已处理 <b>'+st.processed+'</b> 题，其中答对 '+st.correct+' 题。<br>交卷后将归档本轮并查看结果。'
    : '本轮 <b>'+st.total+'</b> 题已全部处理完毕。<br>答对 '+st.correct+' 题，答错 '+st.wrong+' 题，跳过 '+st.skipped+' 题。<br>确认后归档并查看结果。';
  openModal('<h2>确认交卷？</h2><p>'+body+'</p>'+
    '<p class="archive-note">交卷后本场错题将按场次归档到错题本。</p>'+
    '<div class="modal-actions"><button class="btn btn-soft" data-act="close-modal" data-autofocus>继续答题</button>'+
    '<button class="btn btn-primary" data-act="do-finish">确认交卷</button></div>');
}
function doFinish(){
  const s=state.session; if(!s) return;
  const st=sessionStats(s);
  let corrected=0, still=0;
  if(s.mode==="redo"){
    s.queue.forEach(no=>{ const a=s.answers[no]; if(a&&a.status==="correct") corrected++; else still++; });
  }
  if(!archiveActive()){
    showArchiveError();
    announce("保存失败，请重试，本轮进度已保留");
    return;
  }
  state.result={mode:s.mode,queue:s.queue.slice(),answers:JSON.parse(JSON.stringify(s.answers)),
    elapsedMs:s.elapsedMs||0,stats:st,corrected,still,endedAt:Date.now()};
  closeModal();
  go("#/result");
  announce("已交卷，本场错题已归档");
}

      '<button class="btn btn-primary" data-act="go-home">开始一次练习</button></div>';
  }
  // 首次进入：默认展开「最新且有未订正错题」的一场；不持久化
  if(state.wbExpanded===null && !state.wbAutoPicked){
    const cand=state.exams.find(e=>examActiveCount(e)>0) || state.exams[0];
    state.wbExpanded=cand?cand.id:null;
  }
  state.wbAutoPicked=true;
  const pageSize=10;
  const expandedIdx=state.exams.findIndex(e=>e.id===state.wbExpanded);
  if(expandedIdx>=pageSize*state.wbPage) state.wbPage=Math.floor(expandedIdx/pageSize)+1;
  const visible=state.exams.slice(0,pageSize*state.wbPage);
  const more=(visible.length<state.exams.length)
    ? '<button class="btn btn-soft load-more" type="button" data-act="wb-more">加载更多考试（还有 '+(state.exams.length-visible.length)+' 场）</button>' : '';
  const notice=(active===0)?'<div class="wb-notice">当前没有待订正错题，考试记录仍可展开查看。</div>':'';
  return head+notice+'<div class="exam-list" id="examList" tabindex="-1">'+visible.map(renderExamCard).join("")+'</div>'+more;
}

/* ==================== 16. 收藏切换 / 局部同步 ==================== */
function updateFavCounts(){
  const n=favCount();
  const nav=document.querySelector(".nav-fav");
  if(nav){
    nav.classList.toggle("is-fav",n>0);
    nav.setAttribute("aria-label","我的收藏，当前"+n+"题已收藏");
    nav.setAttribute("title","收藏错题 · "+n+" 题");
    let b=nav.querySelector(".nav-fav-count");
    if(n>0){
      if(!b){ b=document.createElement("span"); b.className="nav-fav-count"; nav.appendChild(b); }
      b.textContent=n; b.classList.remove("hidden");
    }else if(b){ b.classList.add("hidden"); }
  }
  document.querySelectorAll(".fav-sublink").forEach(x=>{
    x.classList.toggle("is-fav",n>0);
    x.setAttribute("aria-label","我的收藏，当前"+n+"题");
    const t=x.querySelector(".fav-sublink-text");
    if(t) t.textContent="我的收藏 "+(n>0?n+" 题":"· 还没有收藏的题");
  });
  document.querySelectorAll(".fav-head-btn").forEach(x=>{
    x.classList.toggle("is-fav",n>0);
    x.setAttribute("aria-label","查看我的收藏，当前"+n+"题");
    const t=x.querySelector(".fav-head-count"); if(t) t.textContent=" "+n;
  });
  document.querySelectorAll(".fav-title-count").forEach(x=>{ x.textContent=n; });
}
function applyFavButtonState(el,no){
  const on=isFav(no);
  el.classList.toggle("is-fav",on);
  el.classList.toggle("is-off",!on);
  el.setAttribute("aria-pressed",on?"true":"false");
  const labelText=(on?"取消收藏第":"收藏第")+no+"题";
  el.setAttribute("aria-label",labelText);
  el.setAttribute("title",labelText);
  const label=el.querySelector(".fav-text-btn-label");
  if(label) label.textContent=on?"已收藏":"收藏这道题";
}
// 就地改属性、不替换节点：保留键盘焦点；data-no 覆盖跨场同题的所有星标
function syncFav(no){
  document.querySelectorAll('#app [data-act="fav-toggle"][data-no="'+no+'"]')
    .forEach(x=>applyFavButtonState(x,no));
  updateFavCounts();
}
function popStar(btn){
  if(!btn) return;
  btn.classList.remove("is-pop"); void btn.offsetWidth; btn.classList.add("is-pop");
  setTimeout(()=>{ if(btn) btn.classList.remove("is-pop"); },220);
}
function toggleFav(no, btn){
  no=+no;
  if(!QUIZ_BY_NO[no]){ announce("该题目不存在，无法收藏"); return; }
  const was=isFav(no);
  const next=Object.assign({},state.favs);
  if(was) delete next[no]; else next[no]={at:Date.now()};
  store.set("favs",next);
  let back=null; try{ back=JSON.parse(rawGet("favs")||"null"); }catch(e){}
  const ok=isPlainObject(back) && Object.keys(back).length===Object.keys(next).length &&
    Object.keys(next).every(k=>back[k] && back[k].at===next[k].at);
  if(!ok){ showSaveError(); announce("保存失败，收藏未生效"); return; }
  state.favs=next;
  const msg=(was?"已取消收藏第":"已收藏第")+no+"题";
  showToast(msg,{duration:2000});
  announce(msg+"，当前共"+favCount()+"题已收藏");
  if(state.route==="favorites" && was){
    const card=document.querySelector('.fav-item[data-fav-no="'+no+'"]');
    if(card){
      const reduce=!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      const remove=()=>{
        const target=card.nextElementSibling||card.previousElementSibling||$("favList");
        card.remove();
        if(target && target.focus) target.focus();
        if(favCount()===0) render();
      };
      syncFav(no);
      if(!reduce){ card.classList.add("is-removing"); setTimeout(remove,160); }
      else remove();
      return;
    }
  }
  syncFav(no);
  if(!was) popStar(btn);
}

/* ==================== 17. 删除操作 ==================== */
function showSaveError(){ showToast("当前无法保存，刷新后可能丢失",{duration:4000}); }
function focusExamList(){ const c=$("examList"); if(c) c.focus(); }
function openDeleteWrongConfirm(examId,no,trigger){
  const e=state.exams.find(x=>x.id===examId);
  const w=e&&e.wrongItems.find(x=>x.no===no);
  if(!e||!w) return;
  openModal('<h2 class="title-with-icon">'+ICON.warn+'从错题本移除这道题？</h2>'+
    '<p>确认移除<b>第 '+w.no+' 题</b>？仅从错题本移除，不影响你的作答记录与历史成绩。</p>'+
    '<div class="modal-actions"><button class="btn btn-soft" type="button" data-act="close-modal" data-autofocus>取消</button>'+
    '<button class="btn btn-danger" type="button" data-act="do-del-item" data-id="'+examId+'" data-no="'+no+'">删除</button></div>',
    trigger,"modal-del");
}
function deleteWrongItem(examId,no){
  const e=state.exams.find(x=>x.id===examId); if(!e) return;
  if(!e.wrongItems.some(w=>w.no===no)) return;
  const snapshot=JSON.parse(JSON.stringify(state.exams));
  const next=state.exams.map(x=> x.id===examId
    ? Object.assign({},x,{wrongItems:x.wrongItems.filter(w=>w.no!==no)}) : x);
  if(!persistExams(next)){ showSaveError(); announce("保存失败，删除未生效"); return; }
  updateHeaderCounts();
  if(state.route==="wrongbook"){ render(); focusExamList(); }
  showToast("已从错题本移除第 "+no+" 题",{undo:()=>{
    if(!persistExams(snapshot)){ announce("撤销失败，请重试"); return; }
    updateHeaderCounts(); if(state.route==="wrongbook"){ render(); focusExamList(); }
    announce("已撤销删除第"+no+"题，当前待订正"+activeWrongCount()+"题");
  },duration:5000});
  announce("已删除第"+no+"题错题，当前待订正"+activeWrongCount()+"题");
}
function openDeleteExamConfirm(examId,trigger){
  const e=state.exams.find(x=>x.id===examId); if(!e) return;
  const act=examActiveCount(e), total=e.wrongItems.length;
  const label="第 "+e.seq+" 场（"+fmtDateTime(e.createdAt)+"）";
  const body=total
    ? '将删除「'+label+'」及其下全部 '+total+' 道错题'+(act?'（含 '+act+' 道待订正）':'')+'。历史做题统计不会被修改。'
    : '将删除「'+label+'」。该场没有错题，历史做题统计不会被修改。';
  openModal('<div class="danger-banner">此操作不可撤销</div>'+
    '<h2 class="title-with-icon">'+ICON.warn+'删除「第 '+e.seq+' 场」？</h2>'+
    '<p>'+body+'</p>'+
    '<div class="modal-actions"><button class="btn btn-soft" type="button" data-act="close-modal" data-autofocus>取消</button>'+
    '<button class="btn btn-danger" type="button" data-act="do-del-exam" data-id="'+examId+'">'+
      (total?'删除本场全部 '+total+' 题':'删除本场')+'</button></div>',
    trigger,"modal-del-exam");
}
function deleteExam(examId){
  const e=state.exams.find(x=>x.id===examId); if(!e) return;
  const next=state.exams.filter(x=>x.id!==examId);
  if(!persistExams(next)){ showSaveError(); announce("保存失败，删除未生效"); return; }
  if(state.wbExpanded===examId) state.wbExpanded=null;
  updateHeaderCounts();
  if(state.route==="wrongbook"){ render(); focusExamList(); }
  announce("已删除第"+e.seq+"场考试，当前待订正"+activeWrongCount()+"题");
}

let toastTimer=null;
function showToast(msg, opts){
  opts=opts||{}; const el=$("toast"); if(!el) return;
  clearTimeout(toastTimer);
  el.innerHTML='<span>'+escapeHtml(msg)+'</span>'+(opts.undo?'<button id="undoBtn" type="button">撤销</button>':'');
  el.classList.add("show");
  const ub=$("undoBtn"); if(ub) ub.onclick=()=>{ try{opts.undo();}finally{ el.classList.remove("show"); } };
  toastTimer=setTimeout(()=>{ el.classList.remove("show"); }, opts.duration||3000);
}

/* ==================== 19. 事件区 ==================== */
function handleAction(act, el){
  const no=+(el.dataset.no||0), id=el.dataset.id||"";
  switch(act){
    case "mode":
      state.selectedMode=+el.dataset.n;
      document.querySelectorAll(".seg").forEach(x=>{ const on=x===el; x.classList.toggle("sel",on); x.setAttribute("aria-pressed",on); });
      break;
    case "start": startMode(state.selectedMode); break;
    case "continue": if(state.session){ state.route="practice"; go("#/practice"); } break;
    case "go-home": go("#/home"); break;
    case "go-wrongbook":
      reviewReset(); go("#/wrongbook"); break;
    case "open-exam":
      state.wbExpanded=id; state.wbAutoPicked=true;
      closeModal(); go("#/wrongbook"); render();
      announce("已定位到第"+((state.exams.find(e=>e.id===id)||{}).seq||"")+"场错题");
      break;
    case "wb-more": state.wbPage++; render(); break;
    case "go-favorites": go("#/favorites"); break;
    case "fav-toggle": case "toggle-fav": toggleFav(no,el); break;
    case "fav-more": state.favPage=(state.favPage||20)+20; render(); break;
    case "start-redo-fav": case "redo-fav":
      // 收藏是题目级标记，允许重做已订正题，不经过 isActiveWrong 过滤
      if(newSession("redo",[no])){ go("#/practice"); announce("已开始重做第"+no+"题"); }
      break;
    case "start-redo": startRedo(); break;
    case "start-redo-one":
      if(isActiveWrong(no)){ if(newSession("redo",[no])){ go("#/practice"); announce("已开始重做第"+no+"题"); } }
      break;
    case "profile": openProfile(el); break;
    case "help": openProfile(el); break;
    case "dispute": openDispute(no); break;
    case "close-guide": state.prefs.guideSeen=true; savePrefs(); if(el.closest(".guide-wrap")) el.closest(".guide-wrap").remove(); break;
    case "close-modal": closeModal(); break;
    case "pill":
      if(state.session){ state.session.filter.status=el.dataset.k; saveSessionSoon(); renderGrid(); }
      break;
    case "clear-search":
      if(state.session){ state.session.filter.query=""; saveSessionSoon(); const si=$("searchInput"); if(si) si.value=""; renderGrid(); }
      break;
    case "toggle-card": toggleCard(no); break;
    case "toggle-exam":
      state.wbExpanded = state.wbExpanded===id ? null : id;
      state.wbAutoPicked=true; render();
      break;
    case "del-wrong-item": openDeleteWrongConfirm(id,no,el); break;
    case "do-del-item": {
      closeModal();
      const uid=id+":"+no;
      if(window.__removingUid===uid) break;
      window.__removingUid=uid;
      let card=null;
      document.querySelectorAll(".wb-item").forEach(x=>{ if(x.dataset && x.dataset.uid===uid) card=x; });
      const reduce=!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      if(card && !reduce){
        card.classList.add("is-removing");
        setTimeout(()=>{ window.__removingUid=null; deleteWrongItem(id,no); },160);
      }else{ window.__removingUid=null; deleteWrongItem(id,no); }
      break;
    }
    case "del-exam": openDeleteExamConfirm(id,el); break;
    case "do-del-exam": closeModal(); deleteExam(id); break;
    case "submit-card": submitCard(no); break;
    case "skip-card": skipCard(no); break;
    case "redo-card": redoCard(no); break;
    case "collapse": if(state.session){ state.session.expanded=null; saveSessionSoon(); renderGrid(); } break;
    case "next-card": nextCard(); break;
    case "next-unanswered": nextCard(); break;
    case "finish": openFinishConfirm(); break;
    case "do-finish": doFinish(); break;
    case "again": startMode(state.result? (state.result.mode==="redo"?state.selectedMode:state.result.mode) : state.selectedMode); break;
    case "redo-round": {
      const r=state.result;
      const nos=r? r.queue.filter(n=>r.answers[n]&&r.answers[n].status==="wrong") : [];
      if(nos.length) startRedoNos(nos); else announce("本轮没有错题可重做");
      break;
    }
  }
}
function reviewReset(){ state.wbExpanded=null; state.wbAutoPicked=false; state.wbPage=1; }

document.addEventListener("click", e=>{
  const modalEl=e.target.closest("#modalRoot [data-act]");
  if(modalEl){ handleAction(modalEl.dataset.act, modalEl); return; }
  const el=e.target.closest("#app [data-act]");
  if(!el) return;
  handleAction(el.dataset.act, el);
});
document.addEventListener("input", e=>{
  if(e.target.matches(".blank-input")){
    const no=+(e.target.dataset.no||0), i=+(e.target.dataset.blank||0);
    const s=state.session; if(!s) return;
    if(!s.drafts[no]) s.drafts[no]=[];
    s.drafts[no][i]=e.target.value;
    saveSessionSoon();
  }else if(e.target.id==="searchInput" && state.session){
    state.session.filter.query=e.target.value;
    state.skipFocus=true;
    renderGrid(); saveSessionSoon();
  }
});
document.addEventListener("keydown", e=>{
  if(state.modalOpen){
    if(e.key==="Escape"){ e.preventDefault(); closeModal(); return; }
    if(e.key==="Tab"){
      const focusables=Array.from($("modalRoot").querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')).filter(x=>!x.disabled);
      if(!focusables.length) return;
      const first=focusables[0], last=focusables[focusables.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
    return;
  }
  if(e.target && e.target.matches && e.target.matches(".blank-input") && e.key==="Enter"){
    e.preventDefault();
    const no=+(e.target.dataset.no||0);
    if(isSubmitted(no)) nextCard(); else submitCard(no);
    return;
  }
  const actEl=e.target && e.target.closest ? e.target.closest('[data-act][role="button"]') : null;
  if(actEl && (e.key==="Enter"||e.key===" "||e.key==="Spacebar")){
    e.preventDefault(); actEl.click(); return;
  }
  if(e.key==="Escape"){
    if(state.session && state.session.expanded!=null){
      state.session.expanded=null; saveSessionSoon(); renderGrid(); announce("已收起题卡");
    }
    return;
  }
  const t=e.target;
  const inField=t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
  if(inField) return;
  if(e.key==="?"||(e.key==="/"&&e.shiftKey)){ e.preventDefault(); openProfile(); return; }
  if(state.route!=="practice"||!state.session) return;
  const k=(e.key||"").toLowerCase();
  if(k==="n"){ e.preventDefault(); nextCard(); }
  else if(k==="j"){ e.preventDefault(); moveCard(1); }
  else if(k==="k"){ e.preventDefault(); moveCard(-1); }
});

/* ==================== 20. 启动 ==================== */
routeFromHash();
if(!location.hash){
  location.replace(state.session ? "#/practice" : "#/home");
  routeFromHash();
}
if(state.route==="result" && !state.result && state.history.length){
  const h=state.history[0], st=h.stats || sessionStats({queue:h.queue||[],answers:h.answers||{}});
  let corrected=0, still=0;
  if(h.mode==="redo"){
    (h.queue||[]).forEach(no=>{ const a=h.answers[no]; if(a&&a.status==="correct") corrected++; else still++; });
  }
  state.result={mode:h.mode,queue:h.queue||[],answers:h.answers||{},elapsedMs:h.elapsedMs||0,
    stats:st,corrected,still,endedAt:h.endedAt};
}
if(state.route==="wrongbook" && !location.hash){ reviewReset(); }
render();
startTicker();
if(migrationCount>0){
  showToast("已清空 "+migrationCount+" 道旧版错题，现在按考试场次重新记录",{duration:4000});
  announce("已清空 "+migrationCount+" 道旧版错题，现在按考试场次重新记录");
}
</script>
</body>
</html>
