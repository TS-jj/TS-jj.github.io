    { no: '08', kind: '视觉实验', title: '手势控制 3D 粒子系统', desc: '捏合凝聚、张掌扩散，用摄像头驱动实时粒子，摄像头不可用时可滑块手动控制。', tags: ['3D 粒子', '手势识别', '实时反馈'], url: 'https://TS-jj.github.io/gesture-particles/', accent: '#7b5cd6' },

/* ========================================== */

const SCALE = [329.63, 369.99, 415.30, 493.88, 554.37, 659.25];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const app = document.getElementById('app');
/* 手机上原生引擎要滚动快照整页，帧率撑不住，默认走自研的轻量开场；?native=1 可强制开启 */
const MOBILE = window.matchMedia('(max-width: 720px), (pointer: coarse)').matches;
const soundBtn = document.getElementById('soundBtn');
const nativeBtn = document.getElementById('nativeBtn');
let token = 0;   /* 只用于取消未完成的异步收尾 */

const Sound = {
  on: true, ctx: null, armed: false,
  /* 浏览器要求音频必须在一次真实交互后才允许播放，所以先解除静音、等第一次点击/按键再真的发声 */
  unlock() {
    if (!this.on) return;
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this.armed && this.ctx.state === 'running') { this.armed = true; this.chime(2); }
  },
  enable() {
    this.on = true;
    this.unlock();
  },
  tone(freq, dur, type, vol) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur);
  },
  tick() { this.tone(760 + Math.random() * 120, 0.035, 'square', 0.025); },
  chime(i) { this.tone(SCALE[((i % SCALE.length) + SCALE.length) % SCALE.length], 0.42, 'sine', 0.055); }
};

/* 第一次点击 / 按键就把音频解锁，之后所有动画音效都直接响 */
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, () => Sound.unlock(), { passive: true })
);

/* ============================================================
   粒子花园 —— 把三个作品的交互语言搬进首页：
   · 指尖花 Fingertip Bloom  粉色花瓣，指针靠近就张开
   · 手势粒子 Gesture Particles  按住凝聚、推开扩散
   · 放飞一颗蒲公英    点一下从中心炸开、飘散
   配色直接取自那几页的源码（#ff5f8a / #ff9dbb / #00ffff / #e9c68b）
   ============================================================ */
let gardenApi = null;

function startGarden() {
  const cv = document.getElementById('garden');
  if (!cv || !cv.getContext) return;
  if (gardenApi && gardenApi.stop) gardenApi.stop();
  const ctx = cv.getContext('2d');
  const soft = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 1, H = 1, cx = 1, cy = 1, dpr = 1, raf = 0, t0 = performance.now();
  let paused = false;                       /* 原生引擎重建时整块画布被盖住，停掉省电省 CPU */
  const P = [];
  const ptr = { x: -999, y: -999, in: false, down: false };
  /* 手机 GPU/CPU 都吃紧：粒子总数和外圈点缀按比例减，肉眼几乎看不出差别 */
  const NARROW = window.innerWidth < 520;
  const F = NARROW ? 0.62 : 1;

  const mk = (x, y, c, r) => ({ hx: x, hy: y, x: x, y: y, vx: 0, vy: 0, c: c, r: r, ph: Math.random() * 6.2832 });

  function makeParticles() {
    P.length = 0;
    const R = Math.min(W, H) * (W < 520 ? 0.34 : 0.40);
    for (let k = 0; k < 6; k++) {                       /* 六片花瓣（纺锤形填充） */
      const a = (k / 6) * Math.PI * 2 - Math.PI / 2;
      const petal = Math.round(34 * F);
      for (let j = 0; j < petal; j++) {
        const t = j / (petal - 1);
        const rr = R * (0.22 + t * 0.78);
        const w = Math.sin(t * Math.PI) * R * 0.17;
        const side = (Math.random() - 0.5) * 2 * w;
        P.push(mk(cx + Math.cos(a) * rr - Math.sin(a) * side,
                  cy + Math.sin(a) * rr + Math.cos(a) * side,
                  t > 0.55 ? '#ff9dbb' : '#ff5f8a', 1 + Math.random() * 1.5));
      }
    }
    for (let j = 0; j < Math.round(62 * F); j++) {      /* 花心 */
      const a = Math.random() * 6.2832, rr = R * Math.pow(Math.random(), 1.7) * 0.26;
      P.push(mk(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, '#ffd9e6', 0.7 + Math.random() * 1.2));
    }
    for (let j = 0; j < Math.round(96 * F); j++) {      /* 外圈青色粒子 */
      const a = Math.random() * 6.2832, rr = R * (0.98 + Math.random() * 0.46);
      P.push(mk(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.9, '#00ffff', 0.6 + Math.random() * 1.1));
    }
    for (let j = 0; j < Math.round(26 * F); j++) {      /* 琥珀星点 */
      P.push(mk(Math.random() * W, Math.random() * H, '#e9c68b', 0.45 + Math.random() * 0.7));
    }
  }

  function resize() {
    const b = cv.getBoundingClientRect();
    const w = Math.max(1, b.width), h = Math.max(1, b.height);
    if (Math.abs(w - W) < 2 && Math.abs(h - H) < 2) return;
    dpr = Math.min(window.devicePixelRatio || 1, NARROW ? 1.5 : 2);
    W = w; H = h;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * 0.5;
    ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, W, H);
    makeParticles();
  }

  function burst(x, y) {
    const ox = x == null ? cx : x, oy = y == null ? cy : y;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const dx = p.x - ox, dy = p.y - oy;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = 5 + Math.random() * 8;
      p.vx += (dx / d) * f;
      p.vy += (dy / d) * f;
    }
    Sound.chime(3);
  }

  function frame(now) {
    if (paused) return;                     /* 暂停期间彻底不出帧，别拿 requestAnimationFrame 空转 */
    const t = (now - t0) / 1000;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(10,9,8,0.14)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      const hx = p.hx + Math.sin(t * 0.8 + p.ph) * 2.6;
      const hy = p.hy + Math.cos(t * 0.66 + p.ph) * 2.6;
      p.vx += (hx - p.x) * 0.014;
      p.vy += (hy - p.y) * 0.014;
      if (ptr.in) {
        const dx = p.x - ptr.x, dy = p.y - ptr.y;
        const d2 = dx * dx + dy * dy;
        const R = 118;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) || 1;
          const f = (1 - d / R) * (ptr.down ? 2.8 : 3.6);
          if (ptr.down) { p.vx -= (dx / d) * f; p.vy -= (dy / d) * f; }
          else { p.vx += (dx / d) * f; p.vy += (dy / d) * f; }
        }
      }
      p.vx *= 0.925; p.vy *= 0.925;
      p.x += p.vx; p.y += p.vy;
      ctx.fillStyle = p.c;
      ctx.globalAlpha = 0.10;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = Math.min(1, 0.38 + p.r * 0.26);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  const at = (e) => {
    const b = cv.getBoundingClientRect();
    return { x: e.clientX - b.left, y: e.clientY - b.top };
  };
  cv.addEventListener('pointermove', (e) => { const p = at(e); ptr.x = p.x; ptr.y = p.y; ptr.in = true; });
  cv.addEventListener('pointerleave', () => { ptr.in = false; ptr.down = false; });
  cv.addEventListener('pointerdown', (e) => { ptr.down = true; const p = at(e); ptr.x = p.x; ptr.y = p.y; ptr.in = true; burst(p.x, p.y); });
  window.addEventListener('pointerup', () => { ptr.down = false; });

  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  else window.addEventListener('resize', resize);

  if (soft) { frame(performance.now() + 16); cancelAnimationFrame(raf); }
  else raf = requestAnimationFrame(frame);
  t0 = performance.now();

  gardenApi = {
    burst: () => burst(),
    stop: () => cancelAnimationFrame(raf),
    pause: () => { paused = true; cancelAnimationFrame(raf); },
    resume: () => { if (!paused) return; paused = false; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); },
  };
}

function showAll() {

}

/* ---- 背景音乐 ----
   浏览器不允许「带声音的自动播放」：先自己试一次，被拦下就挂到用户第一次触摸/按键上；
   开头会淡入，切到后台自动暂停，回来接着放。 */
const bgm = document.getElementById('bgm');
const BGM_VOL = 0.42;
let bgmArmed = false;        // 是否已经真正开始播过
let bgmPrefetched = false;   // 是否已经把缓冲级别提到 auto

function bgmRamp(to, ms) {
  if (!bgm) return;
  const from = bgm.volume, t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    bgm.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function bgmStart() {
  if (!bgm || !Sound.on) return;
  if (!bgm.paused) { bgmArmed = true; return; }
  bgm.volume = 0;
  const pr = bgm.play();
  if (pr && pr.then) pr.then(() => { bgmArmed = true; bgmRamp(BGM_VOL, 1400); }).catch(() => {});
  else { bgmArmed = true; bgmRamp(BGM_VOL, 1400); }
}

/* 首屏不跟封面抢带宽：load 之后再升级成 auto 预缓冲，等用户点第一下时已经缓冲好了 */
if (bgm) {
  const warm = () => setTimeout(() => {
    if (bgmPrefetched || !bgm.paused) return;
    bgmPrefetched = true;
    try { bgm.preload = 'auto'; bgm.load(); } catch (_) {}
    bgmStart();                       // 有些浏览器此时已允许（用户此前访问过站点）
  }, 1200);
  if (document.readyState === 'complete') warm();
  else window.addEventListener('load', warm, { once: true });

  /* 被自动播放策略拦住时的兜底：第一次真实交互就接上 */
  const kick = () => { if (!bgmArmed || bgm.paused) bgmStart(); };
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, kick, { passive: true }));

  /* 卡顿时保命：解码/网络打嗝导致暂停，稍后自己续上 */
  let retry = 0;
  bgm.addEventListener('waiting', () => {
    if (bgm.paused) return;
    clearTimeout(retry);
    retry = setTimeout(() => { if (bgm.paused && Sound.on) bgmStart(); }, 900);
  });

  /* 切后台暂停，回来续播（省电，也不在后台偷跑） */
  let wasPlaying = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { wasPlaying = !bgm.paused; if (wasPlaying) bgm.pause(); }
    else if (wasPlaying && Sound.on) bgmStart();
  });
}

soundBtn.addEventListener('click', () => {
  if (Sound.on) {
    Sound.on = false; bgm.pause();
    soundBtn.textContent = '声音：关';
  } else {
    Sound.enable(); bgmStart();
    soundBtn.textContent = '声音：开';
    Sound.chime(0);
  }
});
/* ---- 原生引擎：直接加载 Swarm Rebuild 的 swarm.js（未改一行逻辑） ---- */
let nativeLoading = false;
const controlsEl = document.getElementById('controls');

/* 演示完自动收尾：等引擎把所有图层建完，停 1.5s 让人看清「Rebuilt by N agents」，
   然后替用户点一次 Go live，页面淡回真实可点的版本。加 ?hold=1 可以停在结果页手动点。 */
const HOLD = new URLSearchParams(location.search).has('hold');
let autoExiting = false;      // 已排入自动退出
let lastDone = -1;            // 上一轮完成的图层数
let lastMoveAt = 0;           // 最后一次有进度的时间
let stallKicked = false;      // 卡住时是否已经替用户开过 Tour
let liftPending = false;      // 是否已经排过一次「露按钮」定时器
let bgmHinted = false;        // 是否已经提示过「点一下开始播放音乐」
let lastApp = null;           // 上一次观测到的引擎实例，换代就重置自动收尾状态
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 400); }, 3200);
}

/* 引擎的遮罩是 <html> 下的 fixed div，z-index 2147483647，把整页盖住。
   我们的控制条必须挂到 <html> 下并在它之后，才能真的被点到（否则只是被画出来的像素）。 */
function liftControls() {
  if (controlsEl.parentElement === document.documentElement && controlsEl.style.zIndex === '2147483647') return;
  controlsEl.style.zIndex = '2147483647';
  document.documentElement.appendChild(controlsEl);
}
function dropControls() {
  if (controlsEl.parentElement === document.body) return;
  controlsEl.style.zIndex = '';
  document.body.appendChild(controlsEl);
}

nativeBtn.addEventListener('click', () => {
  const api = window.__swarmRebuild;
  if (api && api.app) { api.stop(true); return; }
  if (api) { api.start(); return; }
  if (nativeLoading) return;
  token++; showAll();          // 快照要拍到完整页面，先把开场动画收干净
  nativeLoading = true;
  /* 快照会把可见的按钮也画成图层，所以拍之前先藏起来，挂载后再露出来 */
  controlsEl.classList.add('capturing');
  nativeBtn.textContent = '加载引擎…';
  const s = document.createElement('script');
  s.src = 'swarm-engine.js';
  s.onload = () => { nativeLoading = false; };
  s.onerror = () => { nativeLoading = false; controlsEl.classList.remove('capturing'); nativeBtn.textContent = '引擎加载失败'; };
  document.body.appendChild(s);
});
setInterval(() => {
  const api = window.__swarmRebuild;
  const app = api && api.app;
  const running = !!app;
  if (app !== lastApp) {
    lastApp = app;
    if (app) {
      autoExiting = false; lastDone = -1; lastMoveAt = 0; stallKicked = false; liftPending = false;
      if (gardenApi && gardenApi.pause) gardenApi.pause();   /* 重建期间粒子花园在遮罩后面，停掉省 CPU */
    } else {
      if (gardenApi && gardenApi.resume) gardenApi.resume();
      /* 浏览器不允许带声音自动播放：整段重建期间都没人点过，这里补一句提示，别让人以为坏了 */
      if (bgm && bgm.paused && Sound.on && !bgmHinted) {
        bgmHinted = true;
        setTimeout(() => { if (bgm.paused && Sound.on) toast('点一下页面任意处，就能听到背景音乐'); }, 1600);
      }
    }
  }
  nativeBtn.classList.toggle('on', running);
  controlsEl.classList.toggle('native-min', running);
  const label = running ? (MOBILE ? '退出重建' : '退出原生重建') : (MOBILE ? '原生重建' : '原生引擎重建');
  if (nativeBtn.textContent !== label && !nativeLoading) nativeBtn.textContent = label;
  if (running) {
    if (controlsEl.classList.contains('capturing')) {
      /* 扫描 + 快照大约 1.5s，等它画完再露按钮，避免被拍进画布变成假按钮 */
      if (!liftPending) {
        liftPending = true;
        setTimeout(() => {
          liftPending = false;
          const a2 = window.__swarmRebuild && window.__swarmRebuild.app;
          if (!a2) return;
          controlsEl.classList.remove('capturing');
          liftControls();
          kickTour(a2);            // 开工就开巡游：页面自己往下滚，不用等人滚
        }, 2200);
      }
    } else {
      liftControls();
    }
    autoFinish(api.app);
  } else {
    controlsEl.classList.remove('capturing');
    dropControls();
  }
}, 600);

/* 建完自动退回真实页面：等价于用户点 HUD 上的 Go live */
function autoFinish(app) {
  const view = app && app.view;
  if (!view || HOLD || autoExiting) return;
  if (app.complete) {
    autoExiting = true;
    setTimeout(() => {
      const api = window.__swarmRebuild;
      if (api && api.app) api.stop(true);          // reveal = true，淡回真实页面
      setTimeout(() => {
        if (window.scrollY > 40) window.scrollTo({ top: 0, behavior: 'smooth' });
        toast('重建完成，已自动退出 · 页面现在可以正常点击');
      }, 900);
    }, 1500);
    return;
  }
  /* 有些图层在首屏下方，引擎会等用户滚动才继续。没人滚就一直等——
     所以替用户点一次 Tour（自动巡游），让它自己滚完，收尾才不会再卡住。 */
  const d = app.engine ? app.engine.doneCount : 0;
  if (d !== lastDone) { lastDone = d; lastMoveAt = Date.now(); return; }
  if (!lastMoveAt) { lastMoveAt = Date.now(); return; }
  if (!stallKicked && Date.now() - lastMoveAt > 2500) {
    stallKicked = true;
    kickTour(app);
  }
}

/* 替用户点一次 HUD 上的 Tour（已经在巡游就不动） */
function kickTour(app) {
  if (!app || app.tour) return;
  const btn = app.view && app.view.root && app.view.root.querySelector('[data-a="tour"]');
  if (btn) btn.click();
}
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const api = window.__swarmRebuild;
    if (api && api.app) { api.stop(false); return; }
    token++; showAll();
  }
  if (e.key === 'r' || e.key === 'R') nativeBtn.click();
});

const qs = new URLSearchParams(location.search);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (qs.has('static') || reduce) {
  /* 静态模式直接关掉过渡，截图 / 交作业时不会截到动画中间态 */
  const st = document.createElement('style');
  st.textContent = '*,*::before,*::after{transition:none !important;animation:none !important}';
  document.head.appendChild(st);
  render(); showAll();
} else {
  /* 默认：先把完整页面排好，再交给 Swarm Rebuild 原生引擎整页重建（桌面 / 手机一致） */
  render(); showAll();
  /* 手机流量党 / 省流模式不自动跑：整页快照重建费流量和电，留按钮自己点 */
  const conn = navigator.connection || navigator.mozConnection || {};
  const thrifty = conn.saveData === true || /(^|-)2g$/.test(conn.effectiveType || '');
  if (!(MOBILE && thrifty)) {
    /* 别让「9 张封面解码」和「引擎整页快照」撞在同一帧：等图片 decode + load 之后再交棒，
       最多等 3s（桌面 1.8s）就先跑，网络慢也不至于一直不开始 */
    const imgs = [].slice.call(document.images);
    const decoded = Promise.all(imgs.map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve())));
    const loaded = new Promise(r => (document.readyState === 'complete' ? r() : window.addEventListener('load', r, { once: true })));
    const gate = Promise.race([Promise.all([decoded, loaded]), new Promise(r => setTimeout(r, MOBILE ? 3000 : 1800))]);
    gate.then(() => setTimeout(() => nativeBtn.click(), MOBILE ? 260 : 120));
  }
}
</script>
